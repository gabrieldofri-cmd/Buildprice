<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildPrice Admin</title>
<style>
body{margin:0;background:#0b1020;color:#f5f7fb;font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.panel{width:min(100%,480px);background:#121a2c;border:1px solid #26344e;border-radius:18px;padding:24px;box-sizing:border-box}h1{margin-top:0}p{color:#a8b4c9}input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 12px;background:#0b1020;border:1px solid #26344e;border-radius:9px;color:white}button{padding:12px 16px;background:#a6f06a;color:#0b1020;font-weight:800;border:0;border-radius:9px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;color:#cde8b7}a{color:#a6f06a}
</style></head><body><main class="panel"><h1>BuildPrice Admin</h1><p>Owner-only setup check. Your password is sent to your own site backend and is not stored in this page.</p><form id="form"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required minlength="16"><button>Check site setup</button></form><pre id="result" role="status"></pre><p><a href="/">← Back to BuildPrice</a></p><p>Admin login only checks configuration in this starter. It does not yet edit products or manage refresh schedules.</p><script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const result=document.getElementById("result");result.textContent="Checking…";try{const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value,action:"status"})});const data=await r.json();result.textContent=JSON.stringify(data,null,2)}catch{result.textContent="Could not reach the site backend."}});
</script></main></body></html>
